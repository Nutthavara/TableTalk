# Development infrastructure only. Backend (Go) and frontend (Next.js) run on the host.
name: tabletalk

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabletalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabletalk}
      POSTGRES_DB: ${POSTGRES_DB:-tabletalk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Creates the "keycloak" and "tabletalk_test" databases on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-tabletalk}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-tabletalk}
      # Must match the URL the browser and the Go API use, so the token "iss" claim is identical for both.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
